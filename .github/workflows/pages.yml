name: Deploy sites to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Every <site>/public folder is served at /<site>/. Add a site = add a folder.
      # ROOT_SITE is also served at /, so the custom domain opens it directly.
      - name: Assemble sites
        env:
          ROOT_SITE: sxsw2027
        run: |
          mkdir _site
          cp -r "$ROOT_SITE/public/." _site/
          for dir in */public/; do
            site="${dir%%/*}"
            cp -r "$dir" "_site/$site"
          done
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
