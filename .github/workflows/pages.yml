name: Deploy sites to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Every <site>/public folder is served at /<site>/. Add a site = add a folder.
      - name: Assemble sites
        run: |
          mkdir _site
          echo '<!doctype html><meta charset="utf-8"><title>Sites</title><ul>' > _site/index.html
          for dir in */public/; do
            site="${dir%%/*}"
            cp -r "$dir" "_site/$site"
            echo "<li><a href=\"$site/\">$site</a></li>" >> _site/index.html
          done
          echo '</ul>' >> _site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
